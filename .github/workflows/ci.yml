# CI workflow for OpenZeppelin UI
# ================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Check if app creds exist (base repo only)
        id: has-app
        run: |
          present=true
          if [ "${{ github.event.pull_request.head.repo.fork || false }}" = "true" ]; then present=false; fi
          if [ -z "${{ vars.GH_APP_ID }}" ] || [ -z "${{ secrets.GH_APP_PRIVATE_KEY }}" ]; then present=false; fi
          echo "present=$present" >> "$GITHUB_OUTPUT"

      - uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        id: gh-app-token
        if: steps.has-app.outputs.present == 'true'
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Select token
        id: auth
        run: |
          if [ "${{ steps.has-app.outputs.present }}" = "true" ]; then
            echo "token=${{ steps.gh-app-token.outputs.token }}" >> "$GITHUB_OUTPUT"
          else
            echo "token=${{ github.token }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare pre-requisites
        uses: ./.github/actions/prepare
        with:
          token: ${{ steps.auth.outputs.token }}
          node-version: ${{ matrix.node-version }}

      - name: Build all packages
        run: pnpm build
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"

      - name: Type check all packages
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Test ES module imports
        run: |
          cat > test-es-modules.mjs << 'EOF'
          import { logger } from './packages/utils/dist/index.mjs';
          import { isEvmNetworkConfig } from './packages/types/dist/index.mjs';
          if (typeof logger === 'object' && typeof isEvmNetworkConfig === 'function') {
            console.log('✅ ES modules working correctly');
            process.exit(0);
          } else {
            console.error('❌ ES module imports failed');
            process.exit(1);
          }
          EOF
          node test-es-modules.mjs
          rm test-es-modules.mjs
