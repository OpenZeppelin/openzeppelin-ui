# CI workflow for OpenZeppelin UI
# ================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Prepare pre-requisites
        uses: ./.github/actions/prepare
        with:
          token: ${{ github.token }}

      - name: Build all packages
        run: pnpm build
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"

      - name: Test ES module imports
        run: |
          cat > test-es-modules.mjs << 'EOF'
          import { logger } from './packages/utils/dist/index.mjs';
          import { isEvmNetworkConfig } from './packages/types/dist/index.mjs';
          if (typeof logger === 'object' && typeof isEvmNetworkConfig === 'function') {
            console.log('✅ ES modules working correctly');
            process.exit(0);
          } else {
            console.error('❌ ES module imports failed');
            process.exit(1);
          }
          EOF
          node test-es-modules.mjs
          rm test-es-modules.mjs

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Prepare pre-requisites
        uses: ./.github/actions/prepare
        with:
          token: ${{ github.token }}

      - name: Build all packages
        run: pnpm build

      - name: Test
        run: pnpm test

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Prepare pre-requisites
        uses: ./.github/actions/prepare
        with:
          token: ${{ github.token }}

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Prepare pre-requisites
        uses: ./.github/actions/prepare
        with:
          token: ${{ github.token }}

      - name: Build all packages
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck
